name: Native Rust release builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: writethere-windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: writethere-linux-x64
          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: writethere-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: writethere-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Target '${{ matrix.target }}'
      - name: Build and package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build-release.sh '${{ matrix.target }}'
      - name: Upload executables, archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
